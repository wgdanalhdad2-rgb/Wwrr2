<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منصة الناقل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>لوحة التحكم والإدارة</h2>
            <a href="/" class="btn btn-secondary">العودة للموقع</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card p-4 shadow-sm mb-4">
            <h4 class="mb-3">إضافة إعلان يدوياً</h4>
            <form method="POST">
                <input type="hidden" name="action" value="add">
                <div class="mb-3">
                    <label class="form-label">عنوان الإعلان</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">القسم</label>
                    <select name="category" class="form-select">
                        <option value="تنازل ونقل كفالة">تنازل ونقل كفالة</option>
                        <option value="استقدام وتأشيرات">استقدام وتأشيرات</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">رقم الجوال (مثال: 0551234567)</label>
                    <input type="text" name="phone" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">نص الإعلان والتفاصيل</label>
                    <textarea name="content" class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">حفظ وإضافة</button>
            </form>
        </div>
    </div>
</body>
</html>
